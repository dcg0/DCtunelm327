name: Android Beta APK build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
          
      - name: Dar permiso a Gradle
        run: chmod +x gradlew
          
      - name: Compilar APK
        run: ./gradlew --no-daemon test assembleDebug
          
      - name: Mostrar rutas generadas
        run: find . -name "*.apk" -type f
          
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: DCtune-Beta-APK
          path: androbd/build/outputs/apk/debug/
